<style>
  :root {
    --ink: #2c4a3e;
    --ink-soft: #3d5e51;
    --bg: #ffffff;
    --bg-warm: #f0ede6;
    --sand: #d4c5a9;
    --sand-soft: #e3d8c2;
    --text: #1f2a24;
    --muted: #6b7570;
    --erro: #a3322a;
    --erro-bg: #fbeeec;
    --display: "Tenor Sans", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --body: "Outfit Variable", "Outfit", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg-warm); color: var(--text);
    font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .topo { background: var(--bg); border-bottom: 1px solid var(--sand-soft); }
  .topo .dentro { max-width: 640px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
  .topo svg { width: 40px; height: 40px; flex: none; }

  .topo .sub { font-size: .8rem; color: var(--muted); }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 120px; }
  .progresso { margin: 4px 0 16px; }
  .progresso .texto { font-size: .8rem; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .progresso .barra { height: 4px; background: var(--sand-soft); border-radius: 2px; overflow: hidden; }

  .cartao { background: var(--bg); border: 1px solid var(--sand-soft); border-radius: 14px; padding: 20px 16px; }

  .muted { color: var(--muted); font-size: .9rem; }

  .campo .dica { display: block; font-size: .85rem; color: var(--muted); margin: -2px 0 6px; font-weight: 400; }

  input[type=text], input[type=email], input[type=tel], select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: #fff;

  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }

  .escolhas { display: flex; flex-wrap: wrap; gap: 8px; }
  .escolhas label {
    position: relative; flex: 1 1 auto; min-width: 84px; display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 44px; padding: 8px 12px; border: 1px solid #c9c3b6; border-radius: 999px; background: #fff; cursor: pointer; font-weight: 400;
  }
  .escolhas input { position: absolute; opacity: 0; pointer-events: none; }
  .escolhas input:checked + span { font-weight: 500; }
  .escolhas label:has(input:checked) { background: var(--ink); border-color: var(--ink); color: #fff; }
  .escolhas label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
  .escolhas.coluna { flex-direction: column; }

  .marcar, .campo > label.marcar { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; font-weight: 400; cursor: pointer; }
  .marcar input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--ink); }
  .erro-campo { color: var(--erro); font-size: .85rem; margin-top: 6px; }
  .invalido input, .invalido select, .invalido textarea, .invalido .escolhas label { border-color: var(--erro); }
  .alerta { background: var(--erro-bg); color: var(--erro); border-radius: 10px; padding: 12px; margin: 12px 0; }
  .ok { text-align: center; padding: 32px 16px; }
  .ok .selo { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 12px; }
  details { border: 1px solid var(--sand-soft); border-radius: 10px; padding: 10px 12px; background: #fbfaf7; }
  details summary { cursor: pointer; font-weight: 500; color: var(--ink); }
  details[open] summary { margin-bottom: 8px; }
  details p, details li { font-size: .9rem; }
  details ul { padding-left: 18px; margin: 0; }
  .resumo dt { color: var(--muted); font-size: .85rem; }

  .lista-sim { margin: 0; padding-left: 18px; }
  .rodape-nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.97); border-top: 1px solid var(--sand-soft);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));

  button { font: inherit; font-size: 16px; border-radius: 999px; min-height: 48px; padding: 0 20px; cursor: pointer; border: 1px solid var(--ink); }
  .primario { background: var(--ink); color: #fff; flex: 1; font-weight: 500; }

<script>
(() => {
  "use strict";
  const API = "https://wyubbsqurhqrztpexkdc.supabase.co/functions/v1/ficha";
  const TERMO = "2026-11-02";
  const UFS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
  const app = document.getElementById("app");
  const nav = document.getElementById("nav");
  const btVoltar = document.getElementById("voltar");
  const btAvancar = document.getElementById("avancar");

  // ---------- utilidades ----------
  function el(tag, attrs, ...filhos) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, "");
      else n.setAttribute(k, String(v));
    }
    for (const f of filhos.flat()) {
      if (f === null || f === undefined || f === false) continue;
      n.append(f instanceof Node ? f : document.createTextNode(String(f)));
    }
    return n;
  }
  const digitos = (s) => String(s || "").replace(/\D/g, "");
  function cpfValido(c) {
    c = digitos(c);
    if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
    for (const t of [9, 10]) {
      let s = 0;
      for (let i = 0; i < t; i++) s += Number(c[i]) * (t + 1 - i);
      const d = ((s * 10) % 11) % 10;
      if (d !== Number(c[t])) return false;
    }
    return true;
  }
  function mascara(valor, tipo) {
    const d = digitos(valor);
    if (tipo === "cpf") {
      const x = d.slice(0, 11);
      return x.replace(/^(\d{3})(\d)/, "$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d{1,2})$/, ".$1-$2");
    }
    if (tipo === "tel") {
      const x = d.slice(0, 11);
      if (x.length <= 2) return x.length ? "(" + x : "";
      if (x.length <= 6) return "(" + x.slice(0, 2) + ") " + x.slice(2);
      if (x.length <= 10) return "(" + x.slice(0, 2) + ") " + x.slice(2, 6) + "-" + x.slice(6);
      return "(" + x.slice(0, 2) + ") " + x.slice(2, 7) + "-" + x.slice(7);
    }
    if (tipo === "cep") {
      const x = d.slice(0, 8);
      return x.length > 5 ? x.slice(0, 5) + "-" + x.slice(5) : x;
    }
    if (tipo === "data") {
      const x = d.slice(0, 8);
      if (x.length <= 2) return x;
      if (x.length <= 4) return x.slice(0, 2) + "/" + x.slice(2);
      return x.slice(0, 2) + "/" + x.slice(2, 4) + "/" + x.slice(4);
    }
    return valor;
  }
  function dataIso(br) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(br || "");
    if (!m) return null;
    const [_, dd, mm, aaaa] = m;
    const d = new Date(Number(aaaa), Number(mm) - 1, Number(dd));
    if (d.getFullYear() !== Number(aaaa) || d.getMonth() !== Number(mm) - 1 || d.getDate() !== Number(dd)) return null;
    if (Number(aaaa) < 1900 || d > new Date()) return null;
    return aaaa + "-" + mm + "-" + dd;
  }
  function idade(iso) {
    if (!iso) return null;
    const [a, m, d] = iso.split("-").map(Number);
    const hoje = new Date();
    let i = hoje.getFullYear() - a;
    if (hoje.getMonth() + 1 < m || (hoje.getMonth() + 1 === m && hoje.getDate() < d)) i--;
    return i;
  }
  const guardar = {
    ler(k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (_) { return null; } },
    gravar(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); return true; } catch (_) { return false; } },
    apagar(k) { try { sessionStorage.removeItem(k); } catch (_) { /* sem armazenamento */ } },
  };

  async function chamar(corpo) {
    let r;
    try {
      r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    } catch (_) {
      throw new Error("Sem conexão. Verifique sua internet e tente de novo.");
    }
    let j = null;
    try { j = await r.json(); } catch (_) { /* resposta vazia */ }
    if (!r.ok) throw new Error((j && j.erro) || "Não consegui falar com o consultório agora. Tente de novo em alguns minutos.");
    return j.dados;
  }

  // ---------- estado ----------
  const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  let codigo = hash.get("c") || "";
  const exemplo = !codigo && (hash.has("exemplo") || location.hash === "#exemplo");
  const CHAVE_CODIGO = "ficha-codigo";
  if (codigo) {
    // Tira o código da barra de endereço (fica só nesta aba, para recarregar).
    if (guardar.gravar(CHAVE_CODIGO, codigo)) history.replaceState(null, "", location.pathname + location.search);
  } else if (!exemplo) {
    codigo = guardar.ler(CHAVE_CODIGO) || "";
  }
  const CHAVE = "ficha-rascunho-" + (exemplo ? "exemplo" : codigo.slice(0, 12));

  const vazio = () => ({
    preenchido_por: "paciente",
    cadastro: { whatsapp: true, endereco: {}, contato_emergencia: {} },
    responsavel: {},
    anamnese: {},
    observacoes: "",
    consentimentos: { privacidade: false, veracidade: false },
    passo: 0,
  });
  let dados = Object.assign(vazio(), guardar.ler(CHAVE) || {});
  let def = null;
  let passos = [];
  let passo = 0;
  let enviando = false;
  const salvar = () => { dados.passo = passo; guardar.gravar(CHAVE, dados); };

  function obter(caminho) {
    return caminho.split(".").reduce((o, k) => (o == null ? undefined : o[k]), dados);
  }
  function definir(caminho, valor) {
    const partes = caminho.split(".");
    let o = dados;
    for (const k of partes.slice(0, -1)) o = o[k] = o[k] && typeof o[k] === "object" ? o[k] : {};
    o[partes[partes.length - 1]] = valor;
    salvar();
  }

  // ---------- campos ----------
  function campoTexto(caminho, rotulo, op) {
    op = op || {};
    const id = "f-" + caminho.replace(/\./g, "-");
    const valorInicial = obter(caminho) || "";
    const input = el(op.multilinha ? "textarea" : "input", {
      id, name: id, type: op.multilinha ? null : (op.tipo || "text"),
      inputmode: op.inputmode, autocomplete: op.autocomplete || "off", placeholder: op.placeholder,
      maxlength: op.max || (op.multilinha ? 600 : 150), autocapitalize: op.capitalizar || null,
    });
    input.value = op.mascara ? mascara(valorInicial, op.mascara) : valorInicial;
    input.addEventListener("input", () => {
      if (op.mascara) {
        const fim = input.selectionStart === input.value.length;
        input.value = mascara(input.value, op.mascara);
        if (fim) input.setSelectionRange(input.value.length, input.value.length);
      }
      definir(caminho, input.value);
      limparErro(caixa);
      if (op.aoMudar) op.aoMudar(input.value);
    });
    const caixa = el("div", { class: "campo", "data-campo": caminho },
      el("label", { for: id }, rotulo, op.obrigatorio ? null : el("span", { class: "opcional" }, " (opcional)")),
      op.dica ? el("span", { class: "dica" }, op.dica) : null,
      input);
    return caixa;
  }

  // ---------- navegação ----------
  let raizes = [];
  function montarPassos() {
    const grupos = [];
    for (const p of def.perguntas) {
      let g = grupos.find((x) => x.grupo === p.grupo);
      if (!g) grupos.push(g = { grupo: p.grupo, perguntas: [] });
      g.perguntas.push(p);
    }
    passos = [etapaInicio(), etapaDados(), etapaEndereco(), ...grupos.map((g) => etapaGrupo(g.grupo, g.perguntas)), etapaFinal()];
    app.replaceChildren();
    const prog = el("div", { class: "progresso" },
      el("div", { class: "texto" }, el("span", { id: "prog-texto" }), el("span", { id: "prog-titulo" })),
      el("div", { class: "barra" }, el("i", { id: "prog-barra" })));
    app.append(prog);
    raizes = passos.map((p) => {
      const raiz = el("section", { hidden: true }, p.corpo());
      app.append(raiz);
      return raiz;
    });
    passo = Math.min(Math.max(0, Number(dados.passo) || 0), passos.length - 1);
    mostrar();
    nav.hidden = false;
  }
  function mostrar() {
    raizes.forEach((r, i) => { r.hidden = i !== passo; });
    const p = passos[passo];
    if (p.aoMostrar) p.aoMostrar(raizes[passo]);
    document.getElementById("prog-texto").textContent = "Etapa " + (passo + 1) + " de " + passos.length;
    document.getElementById("prog-titulo").textContent = p.titulo;
    document.getElementById("prog-barra").style.width = Math.round(((passo + 1) / passos.length) * 100) + "%";
    btVoltar.hidden = passo === 0;
    btAvancar.textContent = passo === 0 ? "Começar" : passo === passos.length - 1 ? (exemplo ? "Enviar (exemplo)" : "Enviar ficha") : "Continuar";
    salvar();
    window.scrollTo({ top: 0 });
  }
  function validarPasso(i) {
    const erros = Array.isArray(passos[i].validar()) ? passos[i].validar() : [];
    const raiz = raizes[i];
    raiz.querySelectorAll(".campo").forEach(limparErro);
    for (const [caminho, msg] of erros) {
      const caixa = raiz.querySelector('[data-campo="' + caminho + '"]');
      if (caixa) mostrarErro(caixa, msg);
    }
    if (erros.length) {
      const primeiro = raiz.querySelector(".invalido");
      if (primeiro) {
        primeiro.scrollIntoView({ behavior: "smooth", block: "center" });
        const foco = primeiro.querySelector("input:not([type=radio]), select, textarea");
        if (foco) setTimeout(() => foco.focus({ preventScroll: true }), 300);
      }
      return false;
    }
    return true;
  }
  btVoltar.addEventListener("click", () => { if (passo > 0) { passo--; mostrar(); } });
  btAvancar.addEventListener("click", async () => {
    if (enviando) return;
    if (!validarPasso(passo)) return;
    if (passo < passos.length - 1) { passo++; mostrar(); return; }
    await enviar();
  });

  function montarEnvio() {
    const c = dados.cadastro;
    const anam = {};
    for (const p of def.perguntas) {
      if (pulaPergunta(p)) continue;
      const a = dados.anamnese[p.codigo];
      if (!a) continue;
      anam[p.codigo] = p.tipo === "texto" ? { resposta: String(a.resposta || "").trim() } :
        { resposta: a.resposta, detalhe: a.resposta === "sim" ? String(a.detalhe || "").trim() : undefined };
    }
    const resp = precisaResponsavel() ? {
      nome: String(dados.responsavel.nome || "").trim(), cpf: digitos(dados.responsavel.cpf),
      parentesco: String(dados.responsavel.parentesco || "").trim(), telefone: digitos(dados.responsavel.telefone),
    } : null;
    return {
      termo_versao: TERMO,
      preenchido_por: dados.preenchido_por,
      consentimentos: { privacidade: dados.consentimentos.privacidade === true, veracidade: dados.consentimentos.veracidade === true },
      cadastro: {
        nome: String(c.nome || "").trim().replace(/\s+/g, " "),
        nome_social: String(c.nome_social || "").trim() || undefined,
        data_nascimento: dataIso(c.data_nascimento_br),
        sexo: c.sexo || undefined,
        cpf: digitos(c.cpf) || undefined,
        rg: String(c.rg || "").trim() || undefined,
        telefone: digitos(c.telefone) || undefined,
        whatsapp: c.whatsapp !== false,
        email: String(c.email || "").trim() || undefined,
        profissao: String(c.profissao || "").trim() || undefined,
        estado_civil: c.estado_civil || undefined,
        endereco: {
          cep: digitos((c.endereco || {}).cep) || undefined,
          logradouro: String((c.endereco || {}).logradouro || "").trim() || undefined,
          numero: String((c.endereco || {}).numero || "").trim() || undefined,
          complemento: String((c.endereco || {}).complemento || "").trim() || undefined,
          bairro: String((c.endereco || {}).bairro || "").trim() || undefined,
          cidade: String((c.endereco || {}).cidade || "").trim() || undefined,
          uf: (c.endereco || {}).uf || undefined,
        },
        contato_emergencia: {
          nome: String((c.contato_emergencia || {}).nome || "").trim() || undefined,
          parentesco: String((c.contato_emergencia || {}).parentesco || "").trim() || undefined,
          telefone: digitos((c.contato_emergencia || {}).telefone) || undefined,
        },
        origem: c.origem || undefined,
      },
      responsavel: resp,
      anamnese: anam,
      observacoes: String(dados.observacoes || "").trim() || undefined,
    };
  }

  async function enviar() {
    const caixaErro = raizes[passos.length - 1].querySelector("#erro-envio");
    caixaErro.replaceChildren();
    if (exemplo) {
      caixaErro.append(el("div", { class: "aviso-exemplo", role: "status" }, "Tudo certo! Como esta é uma ficha de exemplo, nada foi enviado."));
      return;
    }
    enviando = true;
    btAvancar.disabled = true;
    btAvancar.textContent = "Enviando…";
    try {
      const r = await chamar({ acao: "enviar", codigo, respostas: montarEnvio() });
      guardar.apagar(CHAVE);
      guardar.apagar(CHAVE_CODIGO);
      telaFinal("Ficha enviada!", (r && r.mensagem) || "Pronto! Sua ficha foi enviada. Obrigada!", true);
    } catch (e) {
      caixaErro.append(el("div", { class: "alerta", role: "alert" }, e.message));
      caixaErro.scrollIntoView({ behavior: "smooth", block: "center" });
      btAvancar.disabled = false;
      btAvancar.textContent = "Enviar ficha";
    } finally {
      enviando = false;
    }
  }

  function telaFinal(titulo, mensagem, ok, whatsapp) {
    nav.hidden = true;
    app.replaceChildren(el("div", { class: "cartao ok" },
      ok ? el("div", { class: "selo", "aria-hidden": "true" }, "✓") : null,
      el("h1", {}, titulo),
      el("p", {}, mensagem),
      whatsapp ? el("p", {}, el("a", { class: "botao-link", href: "https://wa.me/55" + digitos(whatsapp), rel: "noopener" }, "Falar com a Dra. no WhatsApp")) : null,
      ok ? el("p", { class: "muted" }, "Pode fechar esta página.") : null));
    window.scrollTo({ top: 0 });
  }

  async function iniciar() {
    if (!codigo && !exemplo) {
      telaFinal("Ficha do paciente", "Abra esta página pelo link que você recebeu da Dra. pelo WhatsApp. O link é pessoal.", false);
      return;
    }
    try {
      def = await chamar(exemplo ? { acao: "exemplo" } : { acao: "abrir", codigo });
    } catch (e) {
      app.replaceChildren(el("div", { class: "cartao" },
        el("h1", {}, "Não deu para abrir a ficha"),
        el("p", {}, e.message),
        el("p", {}, el("button", { type: "button", class: "secundario", onclick: () => location.reload() }, "Tentar de novo"))));
      return;
    }
    if (def.status === "enviada") {
      guardar.apagar(CHAVE);
      return telaFinal("Ficha já enviada", def.mensagem, true, def.whatsapp);
    }
    if (def.status === "expirada") {
      guardar.apagar(CHAVE);
      return telaFinal("Link expirado", def.mensagem, false, def.whatsapp);
    }
    if (def.primeiro_nome) document.getElementById("topo-sub").textContent = "Ficha de " + def.primeiro_nome;
    montarPassos();
  }
  iniciar();
})();
</script>
</body>
</html>
