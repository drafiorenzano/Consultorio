# Publica o site do consultório (pasta app/) no GitHub Pages a cada mudança nela.
# Uma vez só: Settings > Pages > Source: GitHub Actions.
name: Site do consultório

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ipad.yml"]
  workflow_dispatch:

permissions:
  actions: read # a publicação precisa achar o pacote do site nesta execução
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v5
